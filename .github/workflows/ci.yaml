name: CI
on:
  push:
  pull_request:
  schedule:
    - cron: "0 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hassfest:
    name: Hassfest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Run every Hassfest validator; tolerate only the documented FinTS core-pin conflict.
      - run: python3 scripts/hassfest.py

  ruff:
    name: Ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pschmitt/ci-workflows/.github/actions/homeassistant-ruff-v10@main
